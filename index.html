        </div>
    </div>

        let state = { currentUser: "", currentDept: "", index: 0, score: 0, currentSet: [], records: [], selectedIndex: null, startTime: 0, duration: 0 };
        let timerInterval = null;

        function fmt(s) {
            if (s === null || s === undefined || s === "") return "-";
            s = Number(s);
            if (isNaN(s)) return "-";
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return m + ":" + String(sec).padStart(2, '0');
        }

        function showScreen(id) {
            ['screen-login', 'screen-quiz', 'screen-result', 'screen-stats'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }
        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            const s = Math.floor((Date.now() - state.startTime) / 1000);
            el.innerText = "Süre: " + fmt(s);
        }

        function startQuiz() {
            const name = document.getElementById('user-name').value.trim();
            const dept = document.getElementById('user-dept').value;
            if (!name || !dept) { document.getElementById('login-error').classList.remove('hidden'); return; }
            document.getElementById('login-error').classList.add('hidden');
            state.currentUser = name; state.currentDept = dept; state.index = 0; state.score = 0;
            state.currentSet = [...soruHavuzu].sort(() => Math.random() - 0.5).slice(0, QUESTION_COUNT);
            state.startTime = Date.now();
            startTimer();
            showScreen('screen-quiz'); renderQuestion();
        }

        function renderQuestion() {
            const q = state.currentSet[state.index];
            state.selectedIndex = null;
            document.getElementById('question-counter').innerText = `Soru ${state.index + 1} / ${state.currentSet.length}`;
            document.getElementById('score-display').innerText = `Puan: ${state.score}`;
            document.getElementById('progress-bar').style.width = `${((state.index + 1) / state.currentSet.length) * 100}%`;
            document.getElementById('question-text').innerText = q.question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('confirm-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn w-full text-left px-3 py-3 border-2 border-slate-200 rounded-xl font-semibold text-slate-700 shadow-sm transition-all hover:border-orange-400 text-xs sm:text-sm bg-white leading-tight min-h-[50px] flex items-center';
                b.innerText = opt;
                b.onclick = () => handleSelection(i);
                container.appendChild(b);
            });
        }

        function handleSelection(idx) {
            state.selectedIndex = idx;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((b, i) => {
                b.classList.remove('selected-option');
                if (i === idx) b.classList.add('selected-option');
            });
            document.getElementById('confirm-btn').classList.remove('hidden');
        }

        function confirmAnswer() {
            if (state.selectedIndex === null) return;
            const q = state.currentSet[state.index];
            const correct = state.selectedIndex === q.correctAnswer;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((b, i) => {
                b.disabled = true;
                b.classList.remove('selected-option', 'hover:border-orange-400');
                if (i === q.correctAnswer) b.classList.add('correct-answer');
                else if (i === state.selectedIndex && !correct) b.classList.add('wrong-answer');
            });
            if (correct) state.score++;
            document.getElementById('score-display').innerText = `Puan: ${state.score}`;
            document.getElementById('confirm-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            state.index++;
            if (state.index < state.currentSet.length) renderQuestion();
            else finish();
        }

        async function finish() {
            clearInterval(timerInterval);
            state.duration = Math.round((Date.now() - state.startTime) / 1000);
            const record = { name: state.currentUser, dept: state.currentDept, score: state.score, duration: state.duration, date: new Date().toLocaleDateString('tr-TR') };
            state.records.push(record);
            document.getElementById('final-score').innerText = `${state.score} / ${state.currentSet.length}`;
            document.getElementById('final-time').innerText = `Süre: ${fmt(state.duration)}`;
            document.getElementById('result-message').innerText = state.score === state.currentSet.length ? "Tam puan. Sıralamadaki yerinizi süreniz belirleyecek." : (state.score >= 6 ? "İyi seviye. Tam puan için talimatları tekrar gözden geçirin." : "İş güvenliği talimatlarını tekrar incelemeniz tavsiye edilir.");
            showScreen('screen-result');

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(record)
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function showStats() {
            const pin = prompt("Yönetici Şifresi:");
            if (pin === "1510") {
                showScreen('screen-stats');
                document.getElementById('loading-container').classList.remove('hidden');
                document.getElementById('loading-container').classList.add('flex');
                try {
                    const response = await fetch(API_URL);
                    state.records = await response.json();
                } catch (error) {
                    console.error(error);
                }
                document.getElementById('loading-container').classList.add('hidden');
                document.getElementById('loading-container').classList.remove('flex');
                updateMonthDropdown();
                renderStatsTable();
            } else if (pin !== null) {
                alert("Hatalı şifre.");
            }
        }

        function updateMonthDropdown() {
            const monthSelect = document.getElementById('filter-month');
            const currentVal = monthSelect.value;
            const months = new Set();
            state.records.forEach(r => {
                if (r.date) {
                    const d = String(r.date).split('.');
                    if (d.length === 3) months.add(`${d[1]}.${d[2]}`);
                    else {
                        const d2 = String(r.date).split('/');
                        if (d2.length === 3) months.add(`${d2[1]}/${d2[2]}`);
                    }
                }
            });
            monthSelect.innerHTML = '<option value="">Tüm Aylar</option>';
            Array.from(months).sort().forEach(m => {
                monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
            monthSelect.value = currentVal;
        }

        // Once skor (yuksek -> dusuk), esitlikte sure (kisa -> uzun); suresi olmayan en sona
        function rankSort(a, b) {
            if (Number(b.score) !== Number(a.score)) return Number(b.score) - Number(a.score);
            const da = (a.duration === "" || a.duration === null || a.duration === undefined) ? Infinity : Number(a.duration);
            const db = (b.duration === "" || b.duration === null || b.duration === undefined) ? Infinity : Number(b.duration);
            return da - db;
        }

        function renderStatsTable() {
            const fMonth = document.getElementById('filter-month').value;
            const fDept = document.getElementById('filter-dept').value;

            let filtered = state.records;
            if (fMonth) filtered = filtered.filter(r => r.date && (String(r.date).includes(`.${fMonth}`) || String(r.date).includes(`/${fMonth}`)));
            if (fDept) filtered = filtered.filter(r => r.dept === fDept);

            // Departman ozeti
            const deptMap = {};
            filtered.forEach(r => {
                if (!deptMap[r.dept]) deptMap[r.dept] = { sum: 0, count: 0, durSum: 0, durCount: 0 };
                deptMap[r.dept].sum += Number(r.score); deptMap[r.dept].count++;
                if (r.duration !== "" && r.duration !== null && r.duration !== undefined && !isNaN(Number(r.duration))) {
                    deptMap[r.dept].durSum += Number(r.duration); deptMap[r.dept].durCount++;
                }
            });
            const dBody = document.getElementById('dept-stats-body'); dBody.innerHTML = '';
            Object.keys(deptMap).forEach(d => {
                const o = deptMap[d];
                const avg = (o.sum / o.count).toFixed(1);
                const avgDur = o.durCount ? fmt(Math.round(o.durSum / o.durCount)) : '-';
                dBody.innerHTML += `<tr><td class="p-2 text-slate-800 font-semibold">${d}</td><td class="p-2 text-center text-slate-600">${o.count}</td><td class="p-2 text-right font-bold text-slate-800">${avg}</td><td class="p-2 text-right text-slate-600">${avgDur}</td></tr>`;
            });

            // Bireysel siralama
            const sorted = [...filtered].sort(rankSort);
            const uBody = document.getElementById('user-stats-body'); uBody.innerHTML = '';
            sorted.slice(0, 100).forEach((r, idx) => {
                const rank = idx + 1;
                let rowClass = '';
                let rankCell = `<span class="text-slate-400 font-bold">${rank}</span>`;
                if (rank === 1) { rowClass = 'bg-amber-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-amber-400 text-white font-extrabold">1</span>`; }
                else if (rank === 2) { rowClass = 'bg-slate-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-400 text-white font-extrabold">2</span>`; }
                else if (rank === 3) { rowClass = 'bg-orange-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-orange-700 text-white font-extrabold">3</span>`; }
                uBody.innerHTML += `<tr class="${rowClass}"><td class="p-2 text-center">${rankCell}</td><td class="p-2 text-slate-800 font-medium">${r.name}</td><td class="p-2 text-slate-500">${r.dept}</td><td class="p-2 text-center font-bold text-slate-800">${r.score}</td><td class="p-2 text-right font-bold text-blue-700">${fmt(r.duration)}</td></tr>`;
            });
        }

        function exportData() {
            const fMonth = document.getElementById('filter-month').value;
            const fDept = document.getElementById('filter-dept').value;
            let filtered = state.records;
            if (fMonth) filtered = filtered.filter(r => r.date && (String(r.date).includes(`.${fMonth}`) || String(r.date).includes(`/${fMonth}`)));
            if (fDept) filtered = filtered.filter(r => r.dept === fDept);
            const sorted = [...filtered].sort(rankSort);

            let csv = "Sira;Ad;Birim;Skor;Sure(sn);Sure;Tarih\n";
            sorted.forEach((r, i) => { csv += `${i + 1};${r.name};${r.dept};${r.score};${r.duration || '-'};${fmt(r.duration)};${r.date || '-'}\n`; });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob); link.download = "oyak_isg_siralama.csv"; link.click();
        }

        function clearAllData() {
            alert("Merkezi veritabanı silme işlemi güvenlik sebebiyle yalnızca Google Sheets üzerinden manuel yapılabilir.");
        }

            document.getElementById('user-name').value = '';
            document.getElementById('user-dept').value = '';
            showScreen('screen-login');
        }

            const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
            on('btn-start', startQuiz);
            on('btn-stats-login', showStats);
            on('confirm-btn', confirmAnswer);
            on('next-btn', nextQuestion);
            on('btn-stats-result', showStats);
            on('btn-reset-result', appReset);
            on('btn-close-stats', appReset);
            on('btn-export', exportData);
            on('btn-clear', clearAllData);
            const fm = document.getElementById('filter-month');
            const fd = document.getElementById('filter-dept');
            if (fm) fm.addEventListener('change', renderStatsTable);
            if (fd) fd.addEventListener('change', renderStatsTable);
        });
    </script>
</body>
</html>
