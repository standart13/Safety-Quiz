<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İş Güvenliği Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        .hidden { display: none !important; }
        .option-btn:disabled { cursor: not-allowed; }
        .selected-option { border-color: #2563eb !important; background-color: #eff6ff !important; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1) !important; color: #1e3a8a !important; }
        .correct-answer { background-color: #22c55e !important; color: white !important; border-color: #22c55e !important; box-shadow: none !important; }
        .wrong-answer { background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important; box-shadow: none !important; opacity: 0.8; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-[100dvh] w-full text-slate-800 m-0 p-0 sm:p-4 bg-gradient-to-br from-slate-100 to-slate-200">

    <div id="app" class="w-full h-full sm:h-[95vh] max-w-xl bg-white sm:rounded-2xl shadow-2xl flex flex-col border border-slate-200 overflow-hidden relative">

        <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white py-2 px-4 text-center shrink-0 shadow-sm z-10">
            <h1 class="text-lg font-extrabold tracking-tight leading-tight">OYAK HORSE</h1>
            <p id="header-subtitle" class="text-amber-100 text-[10px] font-bold tracking-[0.2em] opacity-90 uppercase leading-tight">İş Güvenliği Testi</p>
        </div>

        <div class="p-3 sm:p-5 flex-grow flex flex-col bg-slate-50/50 min-h-0">
            <div id="screen-login" class="flex flex-col justify-center h-full max-w-sm mx-auto w-full overflow-y-auto">
                <div class="text-center mb-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-1">Sisteme Giriş</h2>
                    <p class="text-xs text-slate-500">Teste başlamak için bilgilerinizi giriniz.</p>
                </div>
                <div class="mb-4">
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5" for="user-name">Ad Soyad</label>
                    <input type="text" id="user-name" class="w-full border-2 border-slate-200 rounded-xl px-3 py-3 bg-white focus:outline-none focus:border-orange-600 transition-colors text-sm font-medium shadow-sm" placeholder="Tam adınızı giriniz">
                </div>
                <div class="mb-6">
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5" for="user-dept">Departman</label>
                    <div class="relative">
                        <select id="user-dept" class="w-full border-2 border-slate-200 rounded-xl px-3 py-3 bg-white focus:outline-none focus:border-orange-600 transition-colors text-sm font-medium shadow-sm appearance-none">
                            <option value="">Seçim Yapınız</option>
                            <option value="HSE">İş Sağlığı Güvenliği ve Çevre</option>
                            <option value="Dökümhane">Dökümhane</option>
                            <option value="Motor">Motor</option>
                            <option value="Bakım/Bileme Atölyesi">Bakım</option>
                            <option value="Vites Kutusu">Vites Kutusu</option>
                            <option value="Lojistik">Lojistik</option>
                            <option value="Kalite">Kalite</option>
                            <option value="Ar-Ge">Ar-Ge</option>
                            <option value="Mühendislik">Mühendislik</option>
                            <option value="İnsan Kaynakları">İnsan Kaynakları</option>
                            <option value="Finans/Muhasebe">Finans/Muhasebe</option>
                            <option value="IT">IT</option>
                            <option value="Satınalma">Satınalma</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
                <div id="login-error" class="text-red-500 text-xs mb-4 hidden font-semibold text-center bg-red-50 p-2 rounded-lg border border-red-100">Lütfen tüm alanları doldurunuz.</div>
                <div class="space-y-2 mt-auto">
                    <button id="btn-start" class="w-full bg-gradient-to-r from-orange-700 to-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg text-sm">Teste Başla</button>
                    <button id="btn-stats-login" class="w-full bg-white border-2 border-slate-200 text-slate-600 font-bold py-3.5 rounded-xl text-sm">İstatistikler</button>
                </div>
            </div>

            <div id="screen-quiz" class="hidden flex flex-col h-full justify-between">
                <div class="shrink-0 mb-1">
                    <div class="flex justify-between items-center gap-1 mb-1 text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">
                        <span id="question-counter" class="bg-white px-2 py-0.5 rounded-full shadow-sm border border-slate-100"></span>
                        <span id="timer-display" class="bg-white px-2 py-0.5 rounded-full shadow-sm border border-slate-100 text-blue-700"></span>
                        <span id="score-display" class="bg-white px-2 py-0.5 rounded-full shadow-sm border border-slate-100 text-orange-700"></span>
                    </div>
                    <div class="w-full bg-slate-200 h-1 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-orange-600 h-full rounded-full transition-all duration-500 ease-out"></div>
                    </div>
                </div>

                <h2 id="question-text" class="text-sm sm:text-base font-bold my-3 text-center text-slate-800 leading-snug shrink-0 px-1"></h2>

                <div id="options-container" class="grid grid-cols-1 gap-2 w-full shrink-0"></div>

                <div class="mt-auto pt-2 shrink-0">
                    <button id="confirm-btn" class="hidden w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-md text-sm uppercase tracking-wide">Cevabı Onayla</button>
                    <button id="next-btn" class="hidden w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow-md text-sm uppercase tracking-wide">Sıradaki Soru</button>
                </div>
            </div>

            <div id="screen-result" class="hidden text-center flex flex-col justify-center h-full">
                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-1">Test Tamamlandı</h2>
                <div class="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-700 to-amber-500 my-3 drop-shadow-sm" id="final-score"></div>
                <div id="final-time" class="text-base font-extrabold text-blue-700 mb-3"></div>
                <p id="result-message" class="mb-6 text-slate-600 font-medium text-sm px-2"></p>
                <div class="flex flex-col gap-2 mt-auto max-w-sm mx-auto w-full">
                    <button id="btn-stats-result" class="bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow-md text-sm">Verileri Görüntüle</button>
                    <button id="btn-reset-result" class="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3.5 rounded-xl text-sm">Yeni Katılımcı</button>
                </div>
            </div>

            <div id="screen-stats" class="hidden flex flex-col h-full">
                <div class="flex items-center justify-between mb-2 border-b border-slate-200 pb-2 shrink-0">
                    <h2 class="text-base font-extrabold text-slate-800">Sıralama</h2>
                    <button id="btn-close-stats" class="text-slate-400 hover:text-slate-700 font-bold bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs">Kapat</button>
                </div>
                <div id="loading-container" class="hidden flex-col items-center justify-center py-6 shrink-0">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-orange-700 mb-2"></div>
                    <p id="loading-text" class="text-xs font-medium text-slate-500">Veriler sunucudan çekiliyor...</p>
                </div>
                <div class="flex gap-2 mb-2 shrink-0 flex-row">
                    <div class="relative w-full">
                        <select id="filter-month" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-xs focus:outline-none focus:border-orange-600 bg-white font-medium shadow-sm appearance-none">
                            <option value="">Tüm Aylar</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500"><svg class="fill-current h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                    </div>
                    <div class="relative w-full">
                        <select id="filter-dept" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-xs focus:outline-none focus:border-orange-600 bg-white font-medium shadow-sm appearance-none">
                            <option value="">Tüm Departmanlar</option>
                            <option value="HSE">İş Sağlığı Güvenliği ve Çevre</option>
                            <option value="Dökümhane">Dökümhane</option>
                            <option value="Motor">Motor</option>
                            <option value="Bakım/Bileme Atölyesi">Bakım</option>
                            <option value="Vites Kutusu">Vites Kutusu</option>
                            <option value="Lojistik">Lojistik</option>
                            <option value="Kalite">Kalite</option>
                            <option value="Ar-Ge">Ar-Ge</option>
                            <option value="Mühendislik">Mühendislik</option>
                            <option value="İnsan Kaynakları">İnsan Kaynakları</option>
                            <option value="Finans/Muhasebe">Finans/Muhasebe</option>
                            <option value="IT">IT</option>
                            <option value="Satınalma">Satınalma</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500"><svg class="fill-current h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm mb-2 shrink-0 overflow-y-auto max-h-[18vh]">
                    <table class="w-full text-[10px] sm:text-xs">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0"><tr class="text-slate-500 text-left uppercase tracking-wider font-bold"><th class="p-2">Birim</th><th class="p-2 text-center">Kişi</th><th class="p-2 text-right">Ort Skor</th><th class="p-2 text-right">Ort Süre</th></tr></thead>
                        <tbody id="dept-stats-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex-grow overflow-hidden flex flex-col min-h-0">
                    <div class="overflow-y-auto flex-grow">
                        <table class="w-full text-[10px] sm:text-xs">
                            <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10"><tr class="text-slate-500 text-left uppercase tracking-wider font-bold"><th class="p-2 text-center">#</th><th class="p-2">İsim</th><th class="p-2">Birim</th><th class="p-2 text-center">Skor</th><th class="p-2 text-right">Süre</th></tr></thead>
                            <tbody id="user-stats-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-2 flex flex-col gap-1.5 shrink-0 pt-2 border-t border-slate-200">
                    <button id="btn-export" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl shadow-md text-xs flex items-center justify-center gap-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> CSV İndir
                    </button>
                    <button id="btn-clear" class="text-red-500 font-semibold text-[10px] py-1.5">Sıfırla</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyzEzRZbe8PI27krTyl0GiVB6XZ9DDe2B7IcY4jbw3wVlRP2JTOPCXwZ30uI9jNG3lJ/exec";
        const QUESTION_COUNT = 8;

        const soruHavuzu = [
            { question: "Risk kontrol önlemleri hiyerarşisinde aşağıdakilerden hangisi en öncelikli ve etkili yöntemdir?", options: ["Kişisel koruyucu donanım verilmesi", "Tehlikenin kaynağında tamamen ortadan kaldırılması", "Uyarı ve işaretleme levhaları konulması", "Çalışanlara eğitim verilmesi"], correctAnswer: 1 },
            { question: "Akaryakıt ve yağ kaynaklı (B sınıfı) bir yangına aşağıdakilerden hangisi ile müdahale EDİLMEZ?", options: ["Kuru kimyevi toz", "Köpük", "Karbondioksit (CO2)", "Tazyikli su"], correctAnswer: 3 },
            { question: "Gürültü yönetmeliğine göre en düşük maruziyet eylem değeri kaç dB(A)'dır?", options: ["75 dB(A)", "80 dB(A)", "85 dB(A)", "90 dB(A)"], correctAnswer: 1 },
            { question: "Kapalı/dar alan girişlerinde solunum açısından güvenli kabul edilen oksijen oranı aralığı nedir?", options: ["%10 - 15", "%15 - 18", "%19,5 - 23,5", "%24 - 28"], correctAnswer: 2 },
            { question: "Kilitleme-etiketleme (LOTO) uygulamasında enerji kesilip kilit ve etiket takıldıktan sonra yapılması gereken son adım nedir?", options: ["Çalışmaya hemen başlamak", "Sıfır enerji durumunu test ederek doğrulamak", "Amire haber vermek", "Koruyucu muhafazayı sökmek"], correctAnswer: 1 },
            { question: "Forklift devrilmeye başladığında operatörün yapması gereken doğru davranış nedir?", options: ["Hızla atlayarak araçtan inmek", "Kabinde kalıp direksiyona tutunarak devrilmenin ters yönüne yaslanmak", "Ayağa kalkıp dengeyi sağlamaya çalışmak", "Yükü indirmeye çalışmak"], correctAnswer: 1 },
            { question: "Elektrik akımına kapılmış bir kişiye yapılacak ilk müdahale nedir?", options: ["Kişi hemen elle tutulup çekilir", "Önce enerji kesilir veya iletken olmayan bir cisimle akımdan ayrılır", "Üzerine su dökülür", "Bilinci yerine gelene kadar beklenir"], correctAnswer: 1 },
            { question: "Yüksekte çalışmada koruma önlemleri açısından aşağıdakilerden hangisi önceliklidir?", options: ["Tam vücut emniyet kemeri kullanımı", "Korkuluk ve platform gibi toplu koruma önlemleri", "Baret kullanımı", "Çalışanın dikkatli olması"], correctAnswer: 1 },
            { question: "Bir kimyasalın cilde sıçraması durumunda yapılması gereken doğru ilk müdahale nedir?", options: ["Kimyasalı nötralize etmek için zıt özellikte bir madde dökmek", "Temas eden bölgeyi bol su ile en az 15 dakika yıkamak", "Bölgeyi kuru bezle silmek", "Üzerine merhem sürmek"], correctAnswer: 1 },
            { question: "GHS etiketlemesinde 'alev' piktogramı hangi tehlikeyi ifade eder?", options: ["Aşındırıcı madde", "Yanıcı / parlayıcı madde", "Akut toksik madde", "Oksitleyici madde"], correctAnswer: 1 },
            { question: "Filtreli toz maskesi aşağıdaki durumların hangisinde koruma SAĞLAMAZ?", options: ["Tozlu ortamda çalışırken", "Oksijen oranı yetersiz kapalı alanda", "Zımparalama işleminde", "Talaşlı imalat sırasında"], correctAnswer: 1 },
            { question: "El (dayama) merdiveni güvenli kullanımda zeminle yaklaşık kaç derece açı yapacak şekilde kurulmalıdır?", options: ["45 derece", "60 derece", "75 derece", "90 derece"], correctAnswer: 2 },
            { question: "Bilinci kapalı ancak düzenli nefes alan bir kazazedeye uygulanacak doğru pozisyon hangisidir?", options: ["Sırtüstü düz yatırma", "Oturtma", "Koma (yan yatış) pozisyonu", "Bacakları yukarı kaldırma"], correctAnswer: 2 },
            { question: "Acil çıkış ve ilk yardım işaretlerinde kullanılan zemin rengi hangisidir?", options: ["Kırmızı", "Mavi", "Sarı", "Yeşil"], correctAnswer: 3 },
            { question: "Yanmanın (yangın üçgeni) gerçekleşmesi için bir arada bulunması gereken üç unsur nedir?", options: ["Yakıt, oksijen, ısı", "Yakıt, su, ısı", "Oksijen, su, basınç", "Isı, basınç, nem"], correctAnswer: 0 },
            { question: "Sıcak iş (kaynak, kesme, taşlama) izni aşağıdaki durumların hangisinde özellikle zorunludur?", options: ["Açık havada her koşulda", "Parlayıcı veya patlayıcı madde bulunabilecek alanlarda", "Sadece gece vardiyasında", "Sadece yüksekte çalışırken"], correctAnswer: 1 },
            { question: "Risk değerlendirmesinde risk skoru genel olarak nasıl belirlenir?", options: ["Olasılık ile şiddetin çarpımı", "Çalışan sayısı ile sürenin çarpımı", "Maliyet ile fayda oranı", "Sadece geçmiş kaza sayısı"], correctAnswer: 0 },
            { question: "Vinç ile kaldırılan asılı bir yükün taşınması sırasında aşağıdakilerden hangisi doğrudur?", options: ["Yükün altından hızlıca geçilebilir", "Yükün altında ve salınım hattında kimse bulunmamalıdır", "Yük elle yönlendirilirken altına girilebilir", "Yük baş hizasının üstündeyse risk yoktur"], correctAnswer: 1 },
            { question: "Kişisel koruyucu donanımın (KKD) risk kontrol hiyerarşisindeki yeri nedir?", options: ["İlk ve en etkili önlem", "Diğer tüm önlemler yetersiz kaldığında başvurulan son önlem", "Mühendislik önlemlerinin yerine geçen önlem", "Yalnızca denetimlerde gereken önlem"], correctAnswer: 1 },
            { question: "Dökümhane gibi ortamlarda biriken metal veya organik toz hangi ek riski oluşturur?", options: ["Sadece görüş kaybı", "Toz patlaması riski", "Sadece koku oluşumu", "Herhangi bir risk oluşturmaz"], correctAnswer: 1 },
            { question: "Enerjisi kesilemeyen bir elektrik panosu yangınında en uygun söndürücü hangisidir?", options: ["Köpüklü söndürücü", "Tazyikli su", "Karbondioksit (CO2)", "Islak kimyasal"], correctAnswer: 2 },
            { question: "Kaynak işlemi sırasında göz ve yüz koruması için aşağıdakilerden hangisi kullanılır?", options: ["Standart koruyucu gözlük", "Uygun filtre numaralı kaynak maskesi / yüz siperi", "Güneş gözlüğü", "Sadece toz maskesi"], correctAnswer: 1 },
            { question: "İş ekipmanlarının periyodik kontrolü ile ilgili aşağıdakilerden hangisi doğrudur?", options: ["Hiçbir zaman gerekli değildir", "Yalnızca arıza meydana geldiğinde yapılır", "Kaldırma ekipmanları gibi ekipmanlar belirli periyotlarla yetkili kişilerce kontrol edilmelidir", "Sadece operatörün görsel kontrolü yeterlidir"], correctAnswer: 2 },
            { question: "Ramak kala (kazaya ramak) olaylarının bildirilmesinin temel amacı nedir?", options: ["Sadece istatistik tutmak", "Gerçek kaza yaşanmadan önce önlem alarak tekrarını engellemek", "İlgili çalışanı uyarmak", "Yasal ceza uygulamak"], correctAnswer: 1 },
            { question: "Patlayıcı ortam (ATEX) bulunan alanlarda aşağıdakilerden hangisi yapılmamalıdır?", options: ["Patlamaya karşı korumalı (Ex) ekipman kullanmak", "Kıvılcım çıkarabilecek ekipman veya işlem kullanmak", "Topraklama yapmak", "Yeterli havalandırma sağlamak"], correctAnswer: 1 },
            { question: "Titreşimli el aletlerinin (taşlama, kırıcı) uzun süreli kullanımı öncelikle hangi sağlık riskine yol açar?", options: ["İşitme kaybı", "El-kol titreşim sendromu", "Görme bozukluğu", "Solunum yolu hastalığı"], correctAnswer: 1 },
            { question: "Acil durum tahliyesinde asansör kullanımı ile ilgili doğru ifade hangisidir?", options: ["Hızlı olduğu için tercih edilir", "Kullanılmamalı, merdivenler kullanılmalıdır", "Sadece yük asansörü kullanılır", "Her durumda güvenlidir"], correctAnswer: 1 },
            { question: "Sapan/halat ile yük bağlamada bağlama açısının diklikten yataya doğru artması ne yapar?", options: ["Halat üzerindeki yükü azaltır", "Halat üzerindeki gerilimi (yükü) artırır", "Halat üzerinde hiçbir etkisi yoktur", "Toplam yükü hafifletir"], correctAnswer: 1 },
            { question: "Çelik burunlu iş ayakkabısının 'S3' sınıfı, temel korumaya ek olarak hangi özelliği içerir?", options: ["Sadece burun (parmak) koruması", "Delinmeye dayanıklı taban ve su geçirmezlik", "Sadece kaymazlık", "Sadece elektriksel yalıtım"], correctAnswer: 1 },
            { question: "Yangın söndürücü kullanımında doğru uygulama sırası hangisidir?", options: ["Kola bas, pimi çek, alevin tepesine yönelt", "Pimi çek, alevin dibine yönelt, kola bas, süpürerek uygula", "Alevin tepesine sık, sonra pimi çek", "Önce uzaklaş, sonra kola bas"], correctAnswer: 1 },
            { question: "Ağır (yoğun) dış kanamada ilk yapılması gereken nedir?", options: ["Yaraya doğrudan ve sürekli baskı uygulamak", "İlk iş olarak turnike uygulamak", "Yarayı bol su ile yıkamak", "Kanamanın kendiliğinden durmasını beklemek"], correctAnswer: 0 },
            { question: "Magnezyum, alüminyum gibi yanıcı metal (D sınıfı) yangınına nasıl müdahale edilir?", options: ["Tazyikli su ile", "Köpük ile", "Özel D sınıfı (metal) söndürücü ile", "Karbondioksit ile"], correctAnswer: 2 },
            { question: "Doğalgaz veya LPG kaçağı fark edildiğinde aşağıdakilerden hangisi YAPILMAZ?", options: ["Ortamı havalandırmak", "Gaz vanasını kapatmak", "Elektrik anahtarına basıp aydınlatmayı açmak", "Ortamı terk edip yetkiliye haber vermek"], correctAnswer: 2 },
            { question: "Üçgen biçimli ve sarı zeminli güvenlik işaretleri neyi belirtir?", options: ["Zorunluluk", "Yasak", "Uyarı / tehlike", "Acil çıkış"], correctAnswer: 2 },
            { question: "Yüksekte çalışmada tam vücut emniyet kemerinin kancası nereye bağlanmalıdır?", options: ["Bel hizasının altındaki herhangi bir noktaya", "Bel hizasının üstünde, yeterli dayanımı olan sabit bir ankraj noktasına", "Çalışılan ekipmanın hareketli kısmına", "Başka bir çalışanın emniyet kemerine"], correctAnswer: 1 },
            { question: "Birbiriyle tehlikeli reaksiyona girebilecek kimyasallar (örneğin asit ve baz) nasıl depolanmalıdır?", options: ["Yan yana aynı rafta", "Birbirinden ayrılmış şekilde, farklı bölmelerde", "Üst üste istiflenerek", "Açık alanda karışık halde"], correctAnswer: 1 },
            { question: "Forklift ile yük taşırken kapasite plakasındaki değer ile ilgili doğru ifade hangisidir?", options: ["Kısa mesafelerde aşılabilir", "Hiçbir koşulda aşılmamalıdır", "Yalnızca deneyimli operatör aşabilir", "Yük yüksekteyken aşılabilir"], correctAnswer: 1 },
            { question: "Bir yangın fark edildiğinde yapılması gereken ilk iş nedir?", options: ["Önce kişisel eşyaları toplamak", "Yangın alarmını çalıştırıp durumu bildirmek", "Yangını fotoğraflamak", "Pencereleri açmak"], correctAnswer: 1 },
            { question: "Ekranlı araçlarla (bilgisayar) sürekli çalışanlar için doğru uygulama hangisidir?", options: ["Aralıksız çalışmak verimi artırır", "Düzenli aralarla göz ve duruş molası vermek", "Ekran parlaklığını sürekli en yükseğe almak", "Klavyeyi göz hizasına kaldırmak"], correctAnswer: 1 },
            { question: "Sıcak ortamda çalışırken ısı stresine karşı alınacak doğru önlem hangisidir?", options: ["Sıvı alımını azaltmak", "Düzenli sıvı tüketmek ve serin alanlarda mola vermek", "Daha kalın kıyafet giymek", "Molaları tamamen kaldırmak"], correctAnswer: 1 }
        ];

        let state = { currentUser: "", currentDept: "", index: 0, score: 0, currentSet: [], records: [], selectedIndex: null, startTime: 0, duration: 0 };
        let timerInterval = null;

        function fmt(s) {
            if (s === null || s === undefined || s === "") return "-";
            s = Number(s);
            if (isNaN(s)) return "-";
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return m + ":" + String(sec).padStart(2, '0');
        }

        function showScreen(id) {
            ['screen-login', 'screen-quiz', 'screen-result', 'screen-stats'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }
        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (!el) return;
            const s = Math.floor((Date.now() - state.startTime) / 1000);
            el.innerText = "Süre: " + fmt(s);
        }

        function startQuiz() {
            const name = document.getElementById('user-name').value.trim();
            const dept = document.getElementById('user-dept').value;
            if (!name || !dept) { document.getElementById('login-error').classList.remove('hidden'); return; }
            document.getElementById('login-error').classList.add('hidden');
            state.currentUser = name; state.currentDept = dept; state.index = 0; state.score = 0;
            state.currentSet = [...soruHavuzu].sort(() => Math.random() - 0.5).slice(0, QUESTION_COUNT);
            state.startTime = Date.now();
            startTimer();
            showScreen('screen-quiz'); renderQuestion();
        }

        function renderQuestion() {
            const q = state.currentSet[state.index];
            state.selectedIndex = null;
            document.getElementById('question-counter').innerText = `Soru ${state.index + 1} / ${state.currentSet.length}`;
            document.getElementById('score-display').innerText = `Puan: ${state.score}`;
            document.getElementById('progress-bar').style.width = `${((state.index + 1) / state.currentSet.length) * 100}%`;
            document.getElementById('question-text').innerText = q.question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('confirm-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn w-full text-left px-3 py-3 border-2 border-slate-200 rounded-xl font-semibold text-slate-700 shadow-sm transition-all hover:border-orange-400 text-xs sm:text-sm bg-white leading-tight min-h-[50px] flex items-center';
                b.innerText = opt;
                b.onclick = () => handleSelection(i);
                container.appendChild(b);
            });
        }

        function handleSelection(idx) {
            state.selectedIndex = idx;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((b, i) => {
                b.classList.remove('selected-option');
                if (i === idx) b.classList.add('selected-option');
            });
            document.getElementById('confirm-btn').classList.remove('hidden');
        }

        function confirmAnswer() {
            if (state.selectedIndex === null) return;
            const q = state.currentSet[state.index];
            const correct = state.selectedIndex === q.correctAnswer;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((b, i) => {
                b.disabled = true;
                b.classList.remove('selected-option', 'hover:border-orange-400');
                if (i === q.correctAnswer) b.classList.add('correct-answer');
                else if (i === state.selectedIndex && !correct) b.classList.add('wrong-answer');
            });
            if (correct) state.score++;
            document.getElementById('score-display').innerText = `Puan: ${state.score}`;
            document.getElementById('confirm-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            state.index++;
            if (state.index < state.currentSet.length) renderQuestion();
            else finish();
        }

        async function finish() {
            clearInterval(timerInterval);
            state.duration = Math.round((Date.now() - state.startTime) / 1000);
            const record = { name: state.currentUser, dept: state.currentDept, score: state.score, duration: state.duration, date: new Date().toLocaleDateString('tr-TR') };
            state.records.push(record);
            document.getElementById('final-score').innerText = `${state.score} / ${state.currentSet.length}`;
            document.getElementById('final-time').innerText = `Süre: ${fmt(state.duration)}`;
            document.getElementById('result-message').innerText = state.score === state.currentSet.length ? "Tam puan. Sıralamadaki yerinizi süreniz belirleyecek." : (state.score >= 6 ? "İyi seviye. Tam puan için talimatları tekrar gözden geçirin." : "İş güvenliği talimatlarını tekrar incelemeniz tavsiye edilir.");
            showScreen('screen-result');

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(record)
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function showStats() {
            const pin = prompt("Yönetici Şifresi:");
            if (pin === "1510") {
                showScreen('screen-stats');
                document.getElementById('loading-container').classList.remove('hidden');
                document.getElementById('loading-container').classList.add('flex');
                try {
                    const response = await fetch(API_URL);
                    state.records = await response.json();
                } catch (error) {
                    console.error(error);
                }
                document.getElementById('loading-container').classList.add('hidden');
                document.getElementById('loading-container').classList.remove('flex');
                updateMonthDropdown();
                renderStatsTable();
            } else if (pin !== null) {
                alert("Hatalı şifre.");
            }
        }

        function updateMonthDropdown() {
            const monthSelect = document.getElementById('filter-month');
            const currentVal = monthSelect.value;
            const months = new Set();
            state.records.forEach(r => {
                if (r.date) {
                    const d = String(r.date).split('.');
                    if (d.length === 3) months.add(`${d[1]}.${d[2]}`);
                    else {
                        const d2 = String(r.date).split('/');
                        if (d2.length === 3) months.add(`${d2[1]}/${d2[2]}`);
                    }
                }
            });
            monthSelect.innerHTML = '<option value="">Tüm Aylar</option>';
            Array.from(months).sort().forEach(m => {
                monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
            monthSelect.value = currentVal;
        }

        // Once skor (yuksek -> dusuk), esitlikte sure (kisa -> uzun); suresi olmayan en sona
        function rankSort(a, b) {
            if (Number(b.score) !== Number(a.score)) return Number(b.score) - Number(a.score);
            const da = (a.duration === "" || a.duration === null || a.duration === undefined) ? Infinity : Number(a.duration);
            const db = (b.duration === "" || b.duration === null || b.duration === undefined) ? Infinity : Number(b.duration);
            return da - db;
        }

        function renderStatsTable() {
            const fMonth = document.getElementById('filter-month').value;
            const fDept = document.getElementById('filter-dept').value;

            let filtered = state.records;
            if (fMonth) filtered = filtered.filter(r => r.date && (String(r.date).includes(`.${fMonth}`) || String(r.date).includes(`/${fMonth}`)));
            if (fDept) filtered = filtered.filter(r => r.dept === fDept);

            // Departman ozeti
            const deptMap = {};
            filtered.forEach(r => {
                if (!deptMap[r.dept]) deptMap[r.dept] = { sum: 0, count: 0, durSum: 0, durCount: 0 };
                deptMap[r.dept].sum += Number(r.score); deptMap[r.dept].count++;
                if (r.duration !== "" && r.duration !== null && r.duration !== undefined && !isNaN(Number(r.duration))) {
                    deptMap[r.dept].durSum += Number(r.duration); deptMap[r.dept].durCount++;
                }
            });
            const dBody = document.getElementById('dept-stats-body'); dBody.innerHTML = '';
            Object.keys(deptMap).forEach(d => {
                const o = deptMap[d];
                const avg = (o.sum / o.count).toFixed(1);
                const avgDur = o.durCount ? fmt(Math.round(o.durSum / o.durCount)) : '-';
                dBody.innerHTML += `<tr><td class="p-2 text-slate-800 font-semibold">${d}</td><td class="p-2 text-center text-slate-600">${o.count}</td><td class="p-2 text-right font-bold text-slate-800">${avg}</td><td class="p-2 text-right text-slate-600">${avgDur}</td></tr>`;
            });

            // Bireysel siralama
            const sorted = [...filtered].sort(rankSort);
            const uBody = document.getElementById('user-stats-body'); uBody.innerHTML = '';
            sorted.slice(0, 100).forEach((r, idx) => {
                const rank = idx + 1;
                let rowClass = '';
                let rankCell = `<span class="text-slate-400 font-bold">${rank}</span>`;
                if (rank === 1) { rowClass = 'bg-amber-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-amber-400 text-white font-extrabold">1</span>`; }
                else if (rank === 2) { rowClass = 'bg-slate-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-400 text-white font-extrabold">2</span>`; }
                else if (rank === 3) { rowClass = 'bg-orange-50'; rankCell = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-orange-700 text-white font-extrabold">3</span>`; }
                uBody.innerHTML += `<tr class="${rowClass}"><td class="p-2 text-center">${rankCell}</td><td class="p-2 text-slate-800 font-medium">${r.name}</td><td class="p-2 text-slate-500">${r.dept}</td><td class="p-2 text-center font-bold text-slate-800">${r.score}</td><td class="p-2 text-right font-bold text-blue-700">${fmt(r.duration)}</td></tr>`;
            });
        }

        function exportData() {
            const fMonth = document.getElementById('filter-month').value;
            const fDept = document.getElementById('filter-dept').value;
            let filtered = state.records;
            if (fMonth) filtered = filtered.filter(r => r.date && (String(r.date).includes(`.${fMonth}`) || String(r.date).includes(`/${fMonth}`)));
            if (fDept) filtered = filtered.filter(r => r.dept === fDept);
            const sorted = [...filtered].sort(rankSort);

            let csv = "Sira;Ad;Birim;Skor;Sure(sn);Sure;Tarih\n";
            sorted.forEach((r, i) => { csv += `${i + 1};${r.name};${r.dept};${r.score};${r.duration || '-'};${fmt(r.duration)};${r.date || '-'}\n`; });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob); link.download = "oyak_isg_siralama.csv"; link.click();
        }

        function clearAllData() {
            alert("Merkezi veritabanı silme işlemi güvenlik sebebiyle yalnızca Google Sheets üzerinden manuel yapılabilir.");
        }

        function appReset() {
            document.getElementById('user-name').value = '';
            document.getElementById('user-dept').value = '';
            showScreen('screen-login');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
            on('btn-start', startQuiz);
            on('btn-stats-login', showStats);
            on('confirm-btn', confirmAnswer);
            on('next-btn', nextQuestion);
            on('btn-stats-result', showStats);
            on('btn-reset-result', appReset);
            on('btn-close-stats', appReset);
            on('btn-export', exportData);
            on('btn-clear', clearAllData);
            const fm = document.getElementById('filter-month');
            const fd = document.getElementById('filter-dept');
            if (fm) fm.addEventListener('change', renderStatsTable);
            if (fd) fd.addEventListener('change', renderStatsTable);
        });
    </script>
</body>
